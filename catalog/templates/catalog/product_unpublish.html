{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-warning text-white">
                    <h3 class="mb-0">Отмена публикации продукта</h3>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите отменить публикацию продукта <strong>{{ product.name }}</strong>?</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'catalog:product_detail' pk=product.pk %}" class="btn btn-secondary">
                                Отмена
                            </a>
                            <button type="submit" class="btn btn-warning">
                                ⏸️ Отменить публикацию
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
